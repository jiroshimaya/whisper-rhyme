name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy soundfile pykakasi jamorasep pytest ruff
          python -m pip install --no-deps --editable .
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check .
