[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-rap-hallucination"
version = "0.1.0"
description = "Experiments using Whisper large-v3 as a Japanese rap-text generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jamorasep>=0.0.2",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "openai-whisper>=20250625",
  "pykakasi>=2.3",
  "PyYAML>=6.0",
  "scipy>=1.13",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
